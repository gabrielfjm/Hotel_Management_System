[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings = ignore::DeprecationWarning
markers =
    funcional: etapa 1 - casos derivados de classes de equivalência e valores limite
    estrutural: etapa 2 - ampliações dos casos funcionais para cobrir as lacunas medidas com coverage.py
    mutacao: etapa 3 - ampliações dos casos funcionais para matar mutantes sobreviventes
    secundario: testes complementares de requisito secundário (fora das métricas)
    ce(*ids): classes de equivalência exercitadas pelo caso
    defeito(id, descricao): defeito do código original revelado pelo caso
